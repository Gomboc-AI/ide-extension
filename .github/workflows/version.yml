name: Versioning
on:
  pull_request:
    branches:
      - main

jobs:
  pre-release:
    name: Pre-Release
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm ci
      - name: Generate release notes
        id: semantic-release
        env:
          GH_BRANCH: ${{ github.head_ref }}
        run: |
          unset GITHUB_ACTIONS
          unset GITHUB_EVENT_NAME

          npx semantic-release --dry-run --no-ci --plugins @semantic-release/commit-analyzer,@semantic-release/release-notes-generator --branches $GH_BRANCH > output.txt
          echo "releaseNote=$(cat output.txt | base64 -w 0)" >> "$GITHUB_OUTPUT"
      - name: Report Release Notes
        uses: actions/github-script@v7
        if: ${{ steps.semantic-release.outputs.releaseNote != '' }}
        with:
            script: |
              const { context, github } = require('@actions/github');
              const { generateChangelogs } = require('./scripts/generate-changelogs.js');

              generateChangelogs({ context, github });
