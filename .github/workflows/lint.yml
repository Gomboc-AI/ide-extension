name: Lint

permissions:
  contents: read
  packages: read

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      
      - name: Save NPMRC File
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo 'engine-strict=true' > ~/.npmrc
          echo '@Gomboc-AI:registry=https://npm.pkg.github.com/' >> ~/.npmrc
          echo '//npm.pkg.github.com/:_authToken=${{env.NODE_AUTH_TOKEN}}' >> ~/.npmrc
          # Copy the .npmrc file to the current directory
          cp ~/.npmrc .npmrc

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint
      
      - name: Format
        run: npm run format:check

      - name: Cache ORL Docker image
        id: cache-orl
        uses: actions/cache@v4
        with:
          path: /tmp/orl-image.tar
          key: docker-gombocai-orl-v1.3.0

      - name: Pull ORL Docker image
        if: steps.cache-orl.outputs.cache-hit != 'true'
        run: |
          docker pull gombocai/orl:v1.3.0-latest
          docker save gombocai/orl:v1.3.0-latest -o /tmp/orl-image.tar

      - name: Load ORL Docker image from cache
        if: steps.cache-orl.outputs.cache-hit == 'true'
        run: docker load -i /tmp/orl-image.tar

      - name: Tests
        run: npm run test

      - name: Test coverage
        continue-on-error: true
        run: npm run test:coverage

      - name: Upload coverage
        run: |
            export CODACY_PROJECT_TOKEN=${{ secrets.CODACY_PROJECT_TOKEN }}
            bash <(curl -Ls https://coverage.codacy.com/get.sh)
