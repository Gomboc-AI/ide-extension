name: Publish
permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      id-token: write
      contents: write
      issues: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Save NPMRC File
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo 'engine-strict=true' > ~/.npmrc
          echo '@Gomboc-AI:registry=https://npm.pkg.github.com/' >> ~/.npmrc
          echo '//npm.pkg.github.com/:_authToken=${{env.NODE_AUTH_TOKEN}}' >> ~/.npmrc
          cat ~/.npmrc
          # Copy the .npmrc file to the current directory
          cp ~/.npmrc .npmrc

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund

      - name: Release
        run: npx semantic-release
        env:
          VSCE_PAT: ${{ secrets.VSCE_TOKEN }}
          OVSX_PAT: ${{ secrets.OVSX_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
