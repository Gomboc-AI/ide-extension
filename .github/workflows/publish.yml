name: Release
permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm ci
      - name: Release
        uses: npx semantic-release
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
